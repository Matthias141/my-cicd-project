name: PR Docker Image Scan

# Validation-only: builds the Docker image locally and scans it with Trivy.
# No ECR login, no push, no deploy - the existing Trivy scans in
# build-and-deploy.yml / deploy-staging.yml / deploy-prod.yml tag the image
# with the ECR registry name, which requires AWS credentials just to build
# the tag string. This job never needs AWS credentials at all, which also
# means PR runs (including from less-trusted contexts) never get exposed to
# repo deploy secrets.
#
# Results are uploaded as a plain build artifact rather than to the GitHub
# Security tab: confirmed via live-PR testing that this repo has no "Code
# scanning" section under Settings > Advanced Security (only Dependency
# graph / Dependabot), meaning SARIF upload via codeql-action/upload-sarif
# fails with "Code scanning is not enabled for this repository" - almost
# certainly gated behind GitHub Advanced Security (paid for private repos),
# same wall hit earlier with branch protection enforcement. Matches the
# bandit-results.json artifact pattern already used in
# pr-python-security.yml.

on:
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'app/**'

jobs:
  trivy-scan:
    name: Trivy Container Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally (no registry, no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: pr-validation:${{ github.sha }}

      - name: Run Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: pr-validation:${{ github.sha }}
          format: 'json'
          output: 'trivy-results.json'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-results
          path: trivy-results.json
